<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>基金从业 · 学习站</title>
  <meta name="description" content="基金从业资格考试学习笔记，以 Markdown 为内容源，按 2026 年度修订考试大纲组织。">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menu-btn" aria-label="打开目录">目录</button>
    <a class="brand" href="#/">
      <span class="brand-mark">基</span>
      <span class="brand-text">
        <strong>基金从业 · 学习站</strong>
        <small>2026 大纲 · 科目一</small>
      </span>
    </a>
    <div class="topbar-right">
      <span class="progress-chip" id="progress-chip" title="已完成知识点">—</span>
      <button class="icon-btn" id="theme-btn" aria-label="切换主题">◐</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <nav id="toc" class="toc" aria-label="章节目录">
        <p class="toc-loading">正在加载目录…</p>
      </nav>
    </aside>

    <div class="scrim" id="scrim"></div>

    <main class="main">
      <article id="article" class="prose" aria-live="polite">
        <p class="loading">正在加载…</p>
      </article>

      <nav class="pager" id="pager" aria-label="翻页"></nav>
    </main>
  </div>

  <div class="answer-pop" id="answer-pop" hidden>
    <div class="answer-card">
      <button class="answer-close" id="answer-close" aria-label="关闭">×</button>
      <h3>参考答案</h3>
      <div class="answer-body" id="answer-body"></div>
    </div>
  </div>

  <script src="js/vendor/marked.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
