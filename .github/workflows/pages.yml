# 注意：当前账号因账单问题无法运行 GitHub Actions（job 不会启动）。
# 站点改由 `gh-pages` 分支直接提供（scripts/deploy.sh），本工作流保留备用：
# 账号恢复后，在 Settings → Pages 把 Source 改为 "GitHub Actions" 即可启用。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check content (Markdown 目录清单可用性)
        run: |
          set -e
          test -f content/index.json
          test -f index.html
          echo "内容目录："
          ls -R content

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # 首次运行时自动启用 Pages（源自动设为 GitHub Actions）
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
